# D&VFly — o app da loja Snevy (Colombia White), no Dev Dashboard.
#
# Terceiro app da mesma instalação. A distribuição custom da Shopify amarra um
# app a UMA loja, então cada loja sua ganha um app próprio — e o mesmo servidor
# atende todos (SHOPIFY_CLIENT_ID_3 no .env da VM). Mesmas páginas, as três
# lojas marcáveis em "Publicar em".
#
# TUDO abaixo é igual ao `shopify.app.toml` de propósito: mesmo endereço, mesmos
# escopos, mesmos webhooks. Só mudam o client id e o handle. Duas configurações
# que deveriam ser iguais e são mantidas à mão divergem — por isso este arquivo
# existe em vez de um passo a passo de cliques no painel.
#
# Como usar (na sua máquina, na pasta do projeto):
#
#   1. crie o app no Dev Dashboard DA ORGANIZAÇÃO DESSA LOJA e cole o Client ID
#      dele na linha `client_id` abaixo (o secret NÃO entra aqui — ele vai para
#      o .env da VM, pelo deploy\windows\adicionar-app.ps1);
#   2. npx shopify app deploy --config snevy
#   3. no Dev Dashboard, LANCE a versão criada: escopo que não está numa versão
#      lançada não é concedido, e a loja instala sem poder publicar nada.
#
# Com o `client_id` ainda no texto de exemplo, o CLI procura a organização dona
# de um id que não existe e responde "Cannot find a valid organization" — que
# parece erro de login e não é. Criar o app vem antes de publicar nele.
#
# O `--config snevy` é o que faz o CLI ler ESTE arquivo em vez do principal.
# Sem ele, você publicaria a configuração no app errado.

# O Client ID é público — ele vai no `<meta>` de toda tela do app. O secret não
# entra aqui: vive só no `app/.env` da VM, escrito pelo adicionar-app.ps1.
client_id = "dbcdc8e59f6506e9f9385bfbf801322a"
name = "DVHub Application"
# Único na organização — por isso não pode ser `dvhub-application`.
handle = "dvhub-snevy"

# O MESMO servidor das outras lojas. É isto que faz as lojas viverem no mesmo
# D&VFly: três apps na Shopify, um app rodando.
application_url = "https://app.megaakciok.shop"
embedded = true

[build]
automatically_update_urls_on_dev = false

[access_scopes]
scopes = "write_content,write_themes,write_products"
use_legacy_install_flow = false

[auth]
redirect_urls = ["https://app.megaakciok.shop/app"]

[webhooks]
api_version = "2026-07"

[[webhooks.subscriptions]]
topics = ["app/uninstalled", "app/scopes_update"]
uri = "/webhooks/app"

[[webhooks.subscriptions]]
compliance_topics = ["customers/data_request", "customers/redact", "shop/redact"]
uri = "/webhooks/compliance"
